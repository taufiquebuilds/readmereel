<!doctype html>
<html><head><meta charset="UTF-8" /></head><body><template>
<style>
  #root { position: absolute; inset: 0; overflow: hidden; background: var(--ground); display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: "Inter", sans-serif; }
  #root[data-tone="dark"] { --ink: #f5f6f8; --muted: #a3aab5; --grid: rgba(255, 255, 255, 0.06); }
  #root[data-tone="light"] { --ink: #111418; --muted: #5b6470; --grid: rgba(0, 0, 0, 0.06); }
  /* A drafting grid behind the mark (a .ground layer: the transitions leave it alone). */
  .title-grid { position: absolute; inset: -200px; pointer-events: none;
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 64px 64px; background-position: 200px 200px; }
  /* Content sits above the grid (positioned layers paint over static ones). */
  .title-mark, .title-name, .title-promise { position: relative; }
  .title-mark { display: flex; justify-content: center; }
  .title-badge { width: 150px; height: 150px; border-radius: 38px; background: var(--accent); display: grid; place-items: center; overflow: hidden; flex: none; }
  .title-badge img { width: 110px; height: 110px; object-fit: contain; }
  .title-badge .glyph { display: block; width: 72px; height: 86px; background: var(--ground); border-radius: 9px; clip-path: polygon(0 0, 70% 0, 100% 22%, 100% 100%, 0 100%); }
  .title-name { margin-top: 52px; font-weight: 900; font-size: 200px; letter-spacing: -0.05em; line-height: 1.05; color: var(--ink); white-space: nowrap; text-align: center; }
  .title-name span { display: inline-block; }
  .title-promise { margin-top: 46px; font-weight: 500; font-size: 52px; letter-spacing: -0.012em; line-height: 1.22; color: var(--muted); text-align: center; text-wrap: balance; }
  .title-promise .w { display: inline-block; }
  #root[data-layout="tall"] .title-name { margin-top: 64px; }
  #root[data-layout="tall"] .title-promise { margin-top: 52px; }
</style>
<div id="root" data-composition-id="__ID__" data-width="__W__" data-height="__H__" data-layout="__LAYOUT__" data-style="__STYLE__">
  <div class="ground title-grid" aria-hidden="true" data-layout-ignore></div>
  <div class="title-mark"><div class="title-badge" data-zoom-target>__LOGO__</div></div>
  <div class="title-name hero" data-field="name">__NAME__</div>
  <div class="title-promise" data-field="scenes[__INDEX__].promise">__PROMISE__</div>
  <script type="application/json" class="scene-data">__DATA__</script>
</div>
<script>
__RUNTIME__
(() => {
  const S = RR.scene("__ID__");
  const { tl, D, q, qa, W, wide } = S;
  const [tBadge, tName, tPromise] = D.beats.landTimes;
  const name = q(".title-name");
  const promise = q(".title-promise");
  // Sizes first (they read layout), then the tweens.
  RR.fit(name, wide ? 200 : 150, W * 0.8, 0.6);
  RR.fitLines(promise, wide ? 52 : 64, wide ? 1400 : 920, 3);
  const letters = Array.from(name.textContent);
  name.textContent = "";
  letters.forEach((c) => { const s = document.createElement("span"); s.textContent = c === " " ? "\u00a0" : c; name.appendChild(s); });
  const words = RR.words(promise);
  // The grid settles, the mark is on screen (half size) from the first frame and springs up, the name sharpens letter
  // by letter from a ghost of itself, the promise blurs in word by word: then dead still.
  tl.fromTo(q(".title-grid"), { y: 120 }, { y: 0, duration: 0.8, ease: "expo.out" }, 0)
    .fromTo(q(".title-badge"), { scale: 0.5, rotation: -30 }, { scale: 1, rotation: 0, duration: 0.5, ease: "back.out(1.7)" }, tBadge)
    // Letters 0.035 s apart, but a long name still lands within 0.4 s.
    .fromTo(qa(".title-name span"), { opacity: 0.25, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.28, stagger: Math.min(0.035, 0.4 / Math.max(1, qa(".title-name span").length - 1)), ease: "power2.out" }, tName);
  RR.blurIn(tl, words, tPromise, { stagger: 0.07, duration: 0.16 });
  S.done();
})();
</script>
</template></body></html>
