<!doctype html>
<html><head><meta charset="UTF-8" /></head><body><template>
<style>
  /* A real command, run: a terminal card on a dark (or paper) ground, filmed by a camera that pushes in on the line
     that matters. Layers, back to front: an accent glow and a dot grid (.ground), the camera (.cam, the runtime's zoom
     element, never moved by this scene; inside it .term-move, this scene's own push, and the zoom target).
     The camera opts out of HyperFrames' motion blur (the zoom exit's dive blurs by a filter): a motion-blurred dive is
     redrawn above the runtime's zoom dot. The terminal is always dark: #0d1015 on dark styles, #111418 on paper. Output lines are product UI (data-ui-text),
     30 px wide and 26 px tall; the window's name in the title bar is chrome (data-layout-ignore). */
  #root { position: absolute; inset: 0; overflow: hidden; background: var(--ground); font-family: "Inter", sans-serif; }
  #root { --card: #0d1015; --bar: #3a3f48; --dots: rgba(255, 255, 255, 0.09); --glow-in: 56%; --glow-mid: 30%; }
  #root[data-style="paper"] { --card: #111418; --bar: #3a3f48; --dots: rgba(0, 0, 0, 0.09); }
  /* On a light ground the accent glow is softer (it reads far more there). */
  #root[data-tone="light"] { --dots: rgba(0, 0, 0, 0.09); --glow-in: 34%; --glow-mid: 16%; }
  .term-glow { position: absolute; inset: 0; pointer-events: none; }
  .term-dots { position: absolute; inset: 0; pointer-events: none;
    background-image: radial-gradient(circle, var(--dots) 1.6px, transparent 2.2px); background-size: 36px 36px; background-position: 18px 18px;
    -webkit-mask-image: radial-gradient(ellipse 75% 75% at 50% 50%, #000 40%, transparent 100%); mask-image: radial-gradient(ellipse 75% 75% at 50% 50%, #000 40%, transparent 100%); }
  .cam { position: absolute; left: 0; top: 0; width: 100%; height: 100%; transform-origin: 0 0; }
  .term-move { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  .term { position: relative; width: 1500px; height: 760px; background: var(--card); border-radius: 24px; overflow: hidden; flex: none;
    box-shadow: 0 50px 140px rgba(0, 0, 0, 0.55), 0 0 0 2px rgba(255, 255, 255, 0.2); font-family: "JetBrains Mono", monospace; color: #f5f6f8; }
  #root[data-tone="light"] .term { box-shadow: 0 50px 140px rgba(15, 23, 42, 0.32), 0 0 0 1px rgba(15, 23, 42, 0.2); }
  #root[data-layout="tall"] .term { width: 980px; height: 1300px; }
  .term-head { position: relative; z-index: 1; height: 54px; background: var(--bar); display: flex; align-items: center; gap: 12px; padding: 0 22px; }
  .term-head i { width: 15px; height: 15px; border-radius: 50%; display: block; flex: none; }
  .term-head i:nth-child(1) { background: #ff5f57; } .term-head i:nth-child(2) { background: #febc2e; } .term-head i:nth-child(3) { background: #28c840; }
  .term-name { position: absolute; left: 0; right: 0; top: 0; line-height: 54px; text-align: center; font-family: "Inter", sans-serif; font-weight: 600;
    font-size: 22px; color: #e3e7ec; white-space: nowrap; pointer-events: none; }
  .term-body { padding: 32px 0; }
  #root[data-layout="tall"] .term-body { padding: 44px 0; }
  /* The prompt's context line (the working folder, as a shell theme shows it): a segment on the bar's grey. */
  .term-ctx { padding: 0 56px 14px; line-height: 1; }
  #root[data-layout="tall"] .term-ctx { padding: 0 40px 14px; }
  .term-seg { display: inline-block; font-size: 28px; line-height: 1.3; padding: 6px 18px; border-radius: 10px; background: var(--bar); color: #e3e7ec; white-space: nowrap; }
  #root[data-layout="tall"] .term-seg { font-size: 26px; }
  .term-cmdline { padding: 0 56px; font-size: 40px; line-height: 1.4; white-space: nowrap; font-weight: 700; }
  #root[data-layout="tall"] .term-cmdline { padding: 0 40px; font-size: 38px; }
  .term-p { color: var(--term-accent); margin-right: 0.6em; }
  .term-cursor { display: inline-block; width: 0.6em; height: 1.15em; vertical-align: -0.2em; background: var(--term-accent); margin-left: 0.08em; }
  .term-out { margin-top: 20px; }
  .term-line { position: relative; padding: 0 56px; font-size: 30px; line-height: 1.4; white-space: pre; color: #b4bcc8; }
  #root[data-layout="tall"] .term-line { padding: 0 40px; font-size: 26px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .term-text { position: relative; }
  .term-line.hl .term-text { color: #ffffff; font-weight: 700; }
  .term-bg { position: absolute; inset: 0; background: color-mix(in srgb, var(--term-accent) 18%, transparent); transform-origin: 0 50%; }
  .term-line .term-bar { position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--term-accent); transform-origin: 50% 50%; }
  .term-next { padding: 0 56px; font-size: 30px; line-height: 1.4; font-weight: 700; }
  #root[data-layout="tall"] .term-next { padding: 0 40px; font-size: 26px; }
  .term-target { position: absolute; pointer-events: none; }
</style>
<div id="root" data-composition-id="__ID__" data-width="__W__" data-height="__H__" data-layout="__LAYOUT__" data-style="__STYLE__">
  <div class="ground term-glow" aria-hidden="true" data-layout-ignore></div>
  <div class="ground term-dots" aria-hidden="true" data-layout-ignore></div>
  <div class="cam" data-motion-blur="off">
    <div class="term-move" data-layout-allow-overflow data-motion-blur="off">
      <div class="term hero">
        <div class="term-head"><i></i><i></i><i></i><span class="term-name" data-ui-text data-layout-ignore>__NAME__</span></div>
        <div class="term-body">
          <div class="term-ctx"><span class="term-seg" data-ui-text>~/__NAME__</span></div>
          <div class="term-cmdline"><span class="term-p">$</span><span class="term-cmd" data-field="scenes[__INDEX__].command">__COMMAND__</span><span class="term-cursor"></span></div>
          <div class="term-out">
        __LINES__
          </div>
          <div class="term-next"><span class="term-p">$</span><span class="term-cursor"></span></div>
        </div>
      </div>
    </div>
    <div class="term-target" data-zoom-target data-layout-ignore aria-hidden="true"></div>
  </div>
  <script type="application/json" class="scene-data">__DATA__</script>
</div>
<script>
__RUNTIME__
(() => {
  // The command types out, the output streams in line by line, highlighted lines pop an accent bar, then the camera
  // pushes in on the first highlighted line (or the last line) and holds, at rest by end - 0.45.
  const S = RR.scene("__ID__");
  const { tl, R, D, q, qa, W, H, wide } = S;
  const { typeStart, outputStart } = D.beats;
  const end = D.duration;
  const card = q(".term");
  const cardColour = D.data.style === "paper" ? "#111418" : "#0d1015";
  // The accent as it reads on the card (the ground may be light, the card never is).
  R.style.setProperty("--term-accent", RR.readable(D.data.accent, cardColour, 3.2));

  // ---------- measure first (before any tween touches layout) ----------
  const cmdline = q(".term-cmdline");
  const cmd = q(".term-cmd");
  const pad = wide ? 56 : 40;
  // The command line fits the card on one line (never below 28 px).
  RR.fit(cmdline, wide ? 40 : 38, card.offsetWidth - 2 * pad - 30, 0.6);
  const lines = qa(".term-line");
  const next = q(".term-next");
  // The card is 1500 x 760 (tall 980 x 1300) at most and hugs its content (never below 460 / 760 px tall), so a short
  // run does not sit in a mostly empty window. Twelve long lines can fill it: the next prompt only shows if it fits.
  const body = q(".term-body");
  const MAXH = wide ? 760 : 1300, MINH = wide ? 460 : 760;
  const showNext = body.offsetTop + body.offsetHeight <= MAXH;
  if (!showNext) next.style.display = "none";
  card.style.height = Math.max(MINH, Math.min(MAXH, body.offsetTop + body.offsetHeight + 8)) + "px";
  // The line the camera pushes in on: the first highlighted line, else the last line.
  const focus = q(".term-line.hl") || lines.at(-1);
  // Frame rects from layout (nothing is transformed yet), in the root's own px.
  const rr = R.getBoundingClientRect();
  const k = W / (rr.width || W);
  const rect = (el) => { const r = el.getBoundingClientRect(); return { x: (r.left - rr.left) * k, y: (r.top - rr.top) * k, w: r.width * k, h: r.height * k }; };
  const lineR = rect(focus);
  const textR = rect(focus.querySelector(".term-text"));
  // (inline: its box is the text itself)
  // The push (RR.termPush): up to 1.15 towards the line, the text block (the command and every output line) kept
  // inside the side margins, the line lifted part of the way towards the frame's middle.
  const range = document.createRange();
  const inked = (el) => { range.selectNodeContents(el); const r = range.getBoundingClientRect(); return { x: (r.left - rr.left) * k, y: (r.top - rr.top) * k, w: r.width * k, h: r.height * k }; };
  const texts = [cmdline].concat(lines.map((l) => l.querySelector(".term-text"))).map(inked);
  const bx0 = Math.min(...texts.map((t) => t.x)), bx1 = Math.max(...texts.map((t) => t.x + t.w));
  const by0 = Math.min(...texts.map((t) => t.y)), by1 = Math.max(...texts.map((t) => t.y + t.h));
  const P = RR.termPush(W, H, { x: bx0, y: by0, w: bx1 - bx0, h: by1 - by0 }, lineR);
  const { ox, oy, tx, ty } = P, PUSH = P.scale;
  const onScreen = (x, y) => ({ x: ox + tx + PUSH * (x - ox), y: oy + ty + PUSH * (y - oy) });
  // The zoom target: an untransformed box where the line's text rests after the push (the runtime measures the dive
  // point from layout).
  const c = onScreen(textR.x + textR.w / 2, lineR.y + lineR.h / 2);
  const zs = Math.min(240, Math.max(60, PUSH * Math.max(Math.min(textR.w, 600), lineR.h)));
  Object.assign(q(".term-target").style, { left: c.x - zs / 2 + "px", top: c.y - zs / 2 + "px", width: zs + "px", height: zs + "px" });
  // The glow sits behind the card.
  const cr = rect(card);
  q(".term-glow").style.background = "radial-gradient(" + Math.round(cr.w * (wide ? 0.68 : 0.8)) + "px " + Math.round(cr.h * (wide ? 0.95 : 0.85)) + "px at " + (cr.x + cr.w / 2) + "px " + (cr.y + cr.h / 2) + "px, color-mix(in srgb, var(--accent) var(--glow-in), transparent) 0%, color-mix(in srgb, var(--accent) var(--glow-mid), transparent) 62%, transparent 100%)";

  // ---------- motion ----------
  const rise = D.in ? { y: 160, scale: 1.04, filter: "blur(6px)" } : { y: 420, scale: 1.08, filter: "blur(14px)" };
  tl.fromTo(q(".term-glow"), { opacity: 0 }, { opacity: 1, duration: 0.7, ease: "power1.out" }, 0)
    .fromTo(card, rise, { y: 0, scale: 1, filter: "blur(0px)", duration: 0.55, ease: "expo.out" }, 0)
    .set(card, { filter: "none" }, 0.56);

  // The command types (0.05 s a character); the cursor rides at its end, blinks once it is typed, and moves to the next
  // prompt when the output is done.
  const n = cmd.textContent.length;
  RR.type(tl, cmd, typeStart, 0.05);
  const typed = typeStart + Math.min(1.6, n * 0.05);
  const [cur1, cur2] = qa(".term-cursor");
  const blink = (el, from, to) => { for (let t = from; t < to - 0.01; t += 0.5) tl.set(el, { opacity: 0 }, t).set(el, { opacity: 1 }, Math.min(to, t + 0.25)); };
  tl.set(cur1, { opacity: 1 }, 0);
  blink(cur1, typed + 0.05, outputStart);
  tl.set(cur1, { opacity: 0 }, outputStart);

  // Output streams in, 0.075 s apart; a highlighted line pops its bar and background 0.3 s after it appears.
  lines.forEach((line, i) => {
    const t = outputStart + 0.075 * i;
    tl.fromTo(line, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.12, ease: "power2.out" }, t);
    if (line.classList.contains("hl")) {
      tl.fromTo(line.querySelector(".term-bar"), { scaleY: 0 }, { scaleY: 1, duration: 0.3, ease: "back.out(2.4)" }, t + 0.3)
        .fromTo(line.querySelector(".term-bg"), { opacity: 0, scaleX: 0.6 }, { opacity: 1, scaleX: 1, duration: 0.3, ease: "expo.out" }, t + 0.3)
        .fromTo(line.querySelector(".term-text"), { color: "#b4bcc8" }, { color: "#ffffff", duration: 0.2, ease: "power1.out" }, t + 0.3);
    }
  });
  const outDone = outputStart + 0.075 * lines.length + 0.05;
  if (showNext) {
    tl.fromTo(next, { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "none" }, outDone);
    blink(cur2, outDone + 0.4, end);
  } else tl.set(next, { opacity: 0 }, 0);

  // The push: after the output (and the first highlight's pop), 0.6 s power2.inOut, at rest by end - 0.45. The camera
  // layer opts out of motion blur (data-motion-blur="off" in the markup), so its text stays crisp.
  const move = q(".term-move");
  move.style.transformOrigin = ox + "px " + oy + "px";
  const focusIndex = lines.indexOf(focus);
  const popped = focus.classList.contains("hl") ? outputStart + 0.075 * focusIndex + 0.6 : 0;
  const pushAt = Math.max(0.6, Math.min(Math.max(outDone + 0.05, popped), end - 0.45 - 0.6));
  tl.fromTo(move, { scale: 1, x: 0, y: 0 }, { scale: PUSH, x: tx, y: ty, duration: Math.min(0.6, end - 0.45 - pushAt), ease: "power2.inOut", immediateRender: false }, pushAt);
  S.done();
})();
</script>
</template></body></html>
